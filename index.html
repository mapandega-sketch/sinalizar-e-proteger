<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sinalizar e Proteger</title>
<meta name="description" content="Simulador de treinamento de sinalização de obra em rodovia, em 3D e realidade virtual.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<canvas id="view" aria-label="Rodovia de pista dupla em 3D com sinalização de obra"></canvas>
<div class="top">
  <div class="brand"><div class="logo" aria-hidden="true">SP</div>Sinalizar e Proteger <span>Sinalização de obra</span></div>
  <div class="stats"><span>Tempo <b id="time">0:00</b></span><span>Erros <b id="errs">0</b></span></div>
  <div class="tbar" role="toolbar" aria-label="Visualização">
    <button class="tb on" type="button" id="tDay" aria-pressed="true">Dia</button>
    <button class="tb" type="button" id="tNight" aria-pressed="false">Noite</button>
    <button class="tb" type="button" id="tAir">Vista aérea</button>
    <button class="tb" type="button" id="tDrive">Visão do motorista</button>
    <button class="tb" type="button" id="tMenu">Início</button>
  </div>
</div>
<div class="speed" id="speed" hidden><b id="kmh">80</b><small>km/h · vel. regulamentada <span id="reg">80</span></small></div>
<div class="toast info" id="toast" hidden></div>
<div class="dock">
  <div class="step"><span class="step-n" id="stepN">–</span><div><div class="step-t" id="stepT"></div><div class="step-s" id="stepS"></div></div></div>
  <div class="demo-note" id="demoNote" hidden></div>
  <div class="acts" id="acts"></div>
</div>
<div class="card-wrap" id="cardWrap"><div class="card" id="card"></div></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/" } }
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
